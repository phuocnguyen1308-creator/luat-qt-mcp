# Tải luật BANG Mỹ bằng runner đặt TẠI MỸ.
# Lý do: nhiều cổng lập pháp bang chặn truy cập từ ngoài nước Mỹ; máy ở VN không lấy được.
#
# ⚠ NGUYÊN TẮC DỮ LIỆU: repo/Mac KHÔNG lưu dữ liệu — chỉ là đường trung chuyển.
# File thô đi lên ARTIFACT (tự hết hạn sau 7 ngày), rồi được nạp vào Pi (bảng raw_file).
# Trước đây workflow commit thẳng vào repo; đã bỏ để repo không phình và không giữ data.
#
# Chạy: tab Actions → "Tải luật bang Mỹ" → Run workflow.
name: Luật bang Mỹ — tải & giám sát

on:
  workflow_dispatch:
    inputs:
      ghi_moc:
        description: 'Ghi lại MỐC CHUẨN giám sát (chạy lần đầu, hoặc sau khi đã xác nhận thay đổi)'
        type: boolean
        default: false
  schedule:
    # Mùng 1 hằng tháng 12:00 UTC (19h giờ VN) — chỉ chạy job GIÁM SÁT, không tải lại.
    # ⚠ GitHub tự tắt lịch nếu repo im 60 ngày; thấy lịch ngừng chạy thì push một commit
    #   bất kỳ để bật lại (đây là hành vi của GitHub, không phải lỗi script).
    - cron: '0 12 1 * *'
  push:
    paths:
      - 'tools/fetch_*.py'  # CHỈ script TẢI mới cần chạy lại job fetch.
                            # Trước để 'tools/**': sửa script giám sát cũng kích hoạt job tải
                            # nặng (Kentucky dò thưa mấy phút) hoàn toàn vô ích.

permissions:
  contents: read

jobs:
  # ── GIÁM SÁT: soi 12 cổng bang xem luật có sửa không (nhẹ, chạy theo lịch) ──────
  # Tách khỏi job tải vì hai việc khác nhau: giám sát chỉ đọc mục lục và so số mục,
  # không sinh dữ liệu; tải mới là việc nặng và chỉ làm khi giám sát báo có thay đổi.
  giam_sat:
    if: github.event_name != 'push'      # push sửa script thì chạy job fetch, không cần soi
    runs-on: ubuntu-latest
    permissions:
      contents: write                    # chỉ job này cần quyền ghi (để lưu mốc chuẩn)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Soi 12 cổng bang so với mốc chuẩn
        # KHÔNG continue-on-error: script cố tình exit 1 khi phát hiện luật đổi,
        # để job đỏ và GitHub gửi mail — đó chính là cái chuông báo.
        run: python tools/giam_sat_states.py ${{ inputs.ghi_moc && '--moc' || '' }}

      # Mốc chuẩn = 12 dòng số mục + md5, KHÔNG phải nội dung luật → commit vào repo không
      # phạm nguyên tắc "repo không lưu data". Phải commit thì lần chạy sau mới có cái để so;
      # để trong artifact thì 30 ngày là mất.
      - name: Lưu mốc chuẩn vào repo
        if: inputs.ghi_moc
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/us_state_moc.json
          git diff --staged --quiet || git commit -m "giám sát bang Mỹ: cập nhật mốc chuẩn"
          git push

      - name: Báo cáo chi tiết (kể cả khi có thay đổi)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giam-sat-bang
          path: state_raw/_giam_sat.json
          retention-days: 30
          if-no-files-found: warn

  fetch:
    if: github.event_name != 'schedule'   # lịch tháng chỉ giám sát, không tải lại toàn bộ
    runs-on: ubuntu-latest    # runner của GitHub đặt ở Mỹ
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kiểm tra runner đang ở nước nào
        run: |
          echo "IP: $(curl -s https://api.ipify.org)"
          echo "Quốc gia: $(curl -s https://ipinfo.io/country)"

      # pdftotext KHÔNG có sẵn trên ubuntu-latest — thiếu nó là fetch_states chết ngay
      # (subprocess ném FileNotFoundError, check=False không cứu được).
      - name: Cài poppler-utils (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Tải luật bang
        run: python tools/fetch_states.py
        continue-on-error: true      # một bang hỏng không được chặn các bang còn lại

      # Indiana chặn ở TẦNG TÀI NGUYÊN: xin file JS từ ngoài Mỹ thì server trả HTML,
      # nên headless trên Pi vô ích. Phải render bằng trình duyệt ĐẶT TẠI MỸ.
      - name: Cài selenium (cho Indiana)
        run: pip install --quiet selenium

      - name: Indiana — render SPA bằng headless Chrome
        run: python tools/fetch_indiana.py
        continue-on-error: true

      - name: Đóng gói file thô thành artifact (KHÔNG commit vào repo)
        uses: actions/upload-artifact@v4
        with:
          name: state-raw
          path: state_raw/
          retention-days: 7
          if-no-files-found: error
