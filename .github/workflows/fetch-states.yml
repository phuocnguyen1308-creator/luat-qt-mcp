# Tải luật BANG Mỹ bằng runner đặt TẠI MỸ.
# Lý do: nhiều cổng lập pháp bang chặn truy cập từ ngoài nước Mỹ; máy ở VN không lấy được.
#
# ⚠ NGUYÊN TẮC DỮ LIỆU: repo/Mac KHÔNG lưu dữ liệu — chỉ là đường trung chuyển.
# File thô đi lên ARTIFACT (tự hết hạn sau 7 ngày), rồi được nạp vào Pi (bảng raw_file).
# Trước đây workflow commit thẳng vào repo; đã bỏ để repo không phình và không giữ data.
#
# Chạy: tab Actions → "Tải luật bang Mỹ" → Run workflow.
name: Tải luật bang Mỹ

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/fetch_states.py'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest    # runner của GitHub đặt ở Mỹ
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kiểm tra runner đang ở nước nào
        run: |
          echo "IP: $(curl -s https://api.ipify.org)"
          echo "Quốc gia: $(curl -s https://ipinfo.io/country)"

      - name: Tải luật bang
        run: python tools/fetch_states.py

      - name: Đóng gói file thô thành artifact (KHÔNG commit vào repo)
        uses: actions/upload-artifact@v4
        with:
          name: state-raw
          path: state_raw/
          retention-days: 7
          if-no-files-found: error
