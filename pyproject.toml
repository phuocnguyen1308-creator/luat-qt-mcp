[project]
name = "luat-qt-mcp"
description = "MCP server tra cứu pháp luật QUỐC TẾ (EU/UK/US... toàn văn) trên PostgreSQL"
version = "0.25.0"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "psycopg2-binary>=2.9",
]

[project.scripts]
luat-qt-mcp = "luat_qt_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luat_qt_mcp"]
